version: '3.2'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:80"  # Expose your application's port
    depends_on:
      - db
  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example  # Use a secure password in production
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  db-test:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example  # Use a secure password in production
      MYSQL_TCP_PORT: 3307
    ports:
      - "3307:3307"
    volumes:
      - mysql_data:/var/lib/mysql-test

volumes:
  mysql_data: